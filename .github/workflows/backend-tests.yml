name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kayra
          POSTGRES_PASSWORD: kayra
          POSTGRES_DB: kayra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kayra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Runs every test on SQLite and on Postgres.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://kayra:kayra@localhost:5432/kayra_test
