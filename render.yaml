# Render Blueprint for the Kayra backend. In Render: New > Blueprint > pick this repository.
# Render asks for each value marked `sync: false` when you create it. See SETUP.md, step 4.
services:
  - type: web
    name: kayra-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PLAY_PACKAGE_NAME
        value: com.kayraapp.kayra
      - key: FREE_DAILY_LIMIT
        value: "30"
      - key: PLUS_DAILY_LIMIT
        value: "300"
